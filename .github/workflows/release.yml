name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Build gems
        run: bundle exec rake build_all
      - name: Push to RubyGems
        # Re-runnable after a partial release: "already been pushed" is not an error.
        run: |
          status=0
          for gem in pkg/*.gem; do
            output=$(gem push "$gem" 2>&1) || {
              if echo "$output" | grep -Eqi 'already been pushed|repushing of gem versions is not allowed'; then
                echo "skip: $gem already on RubyGems"
              else
                echo "FAILED: $gem"; echo "$output"; status=1
              fi
              continue
            }
            echo "$output"
          done
          exit $status
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
