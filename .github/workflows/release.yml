name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Build gems
        run: bundle exec rake build_all
      # Credentials expire 15 minutes after this step, so build all gems first.
      - uses: rubygems/configure-rubygems-credentials@8674aee7f9f9055a8b771794d6f1e66b5fad36a9
      - name: Push to RubyGems
        # Re-runnable after a partial release: "already been pushed" is not an error.
        run: |
          status=0
          for gem in pkg/*.gem; do
            output=$(gem push "$gem" 2>&1) || {
              if echo "$output" | grep -Eqi 'already been pushed|repushing of gem versions is not allowed'; then
                echo "skip: $gem already on RubyGems"
              else
                echo "FAILED: $gem"; echo "$output"; status=1
              fi
              continue
            }
            echo "$output"
          done
          exit $status

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes=$(awk -v v="${TAG#v}" '
            $0 ~ "^## \\[" v "\\]" {grab=1; next}
            grab && /^## \[/ {exit}
            grab && /^\[[^]]+\]:/ {exit}
            grab {print}
          ' CHANGELOG.md)
          gh release create "$TAG" --title "$TAG" \
            --notes "${notes:-See [CHANGELOG.md](CHANGELOG.md).}"
