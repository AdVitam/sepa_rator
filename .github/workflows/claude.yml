name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
        github.event.comment.author_association
        || github.event.review.author_association
        || github.event.issue.author_association) &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          settings: '{"includeCoAuthoredBy": false}'
          claude_args: >-
            --model claude-opus-5-5
            --append-system-prompt "Réponds en français.
            Respecte le CLAUDE.md du dépôt.
            Avant de proposer une correction, lis les arbitrages déjà rendus sur la PR ou sur le ticket : ne rouvre pas un point tranché sans élément neuf.
            Corrige la classe du défaut, jamais la seule ligne signalée : cherche ses autres occurrences dans le diff et traite-les dans la même passe. Hors du diff, signale sans toucher.
            Le commentaire est un symptôme, pas une spécification : lis la méthode entière et ses appelants avant d'éditer, et si suivre la demande littéralement casse un cas voisin ou défait une correction antérieure, corrige la cause et dis-le.
            Retire avant d'ajouter. Pas de complexité pour un cas de bord qui n'arrive pas en pratique.
            Commentaires de code : zéro par défaut, uniquement pour un POURQUOI non évident, en anglais, 2 lignes maximum.
            Lance les linters du projet et corrige la cause, jamais le symptôme : pas de eslint-disable ni de rubocop:disable."

          additional_permissions: |
            actions: read
